<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopDynamic - E-commerce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="#">ShopDynamic</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="#products">Shop</a>
      <a class="nav-link" href="#cart">Cart <span id="cart-count" class="badge bg-success">0</span></a>
    </div>
  </nav>


  <main class="container-fluid py-4">
    <div class="row g-4">
      <section class="col-lg-9" id="products">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="mb-0">Our Products</h2>
          <span class="text-muted" id="product-count"></span>
        </div>
        <div class="row g-3" id="product-list"></div>
      </section>


      <aside class="col-lg-3" id="cart">
        <div class="cart-panel">
          <h4 class="mb-3">Shopping Cart</h4>
          <div id="cart-items">
            <p class="text-muted text-center">Your cart is empty.</p>
          </div>
          <hr>
          <div class="d-flex justify-content-between fw-bold fs-5">
            <span>Grand Total:</span>
            <span id="grand-total">₹0</span>
          </div>
          <button class="btn btn-success w-100 mt-3" id="checkout-btn">Proceed to Checkout</button>
        </div>
      </aside>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
