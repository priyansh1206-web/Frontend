<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
    <style>
        body { font-family: Arial; background: #111827; color: white; text-align: center; padding-top: 100px; }
        #clock { font-size: 48px; background: #1f2937; display: inline-block; padding: 25px 35px; border-radius: 12px; }
    </style>
</head>
<body>
    <h1>Digital Clock</h1>
    <div id="clock">00:00:00</div>

    <script>
        function showTime() {
            let now = new Date();
            let hours = String(now.getHours()).padStart(2, "0");
            let minutes = String(now.getMinutes()).padStart(2, "0");
            let seconds = String(now.getSeconds()).padStart(2, "0");

            document.getElementById("clock").innerText =
                hours + ":" + minutes + ":" + seconds;
        }

        showTime();
        setInterval(showTime, 1000);
    </script>
</body>
</html>
