<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
        body { font-family: Arial; background: #fff7ed; padding: 30px 15px; }
        .box { max-width: 450px; margin: auto; background: white; padding: 22px; border-radius: 10px; }
        input { padding: 10px; width: 65%; }
        button { padding: 10px; cursor: pointer; }
        ul { padding-left: 20px; }
        li { margin: 12px 0; }
        li button { margin-left: 8px; }
        .done { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
    <div class="box">
        <h2>My To-Do List</h2>
        <input type="text" id="taskInput" placeholder="Enter a task">
        <button onclick="addTask()">Add</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task.");
                return;
            }

            let li = document.createElement("li");
            let taskText = document.createElement("span");
            taskText.innerText = task;

            let doneButton = document.createElement("button");
            doneButton.innerText = "Complete";
            doneButton.onclick = function () {
                taskText.classList.toggle("done");
            };

            let deleteButton = document.createElement("button");
            deleteButton.innerText = "Delete";
            deleteButton.onclick = function () {
                li.remove();
            };

            li.appendChild(taskText);
            li.appendChild(doneButton);
            li.appendChild(deleteButton);
            document.getElementById("taskList").appendChild(li);
            input.value = "";
            input.focus();
        }
    </script>
</body>
</html>
